<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive visualisation of the nine planetary boundaries (Richardson et al. 2023; Planetary Health Check 2025)." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Planetary Boundaries</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family:sans-serif;color:#fff;text-align:center;padding:4rem">This explorer needs JavaScript enabled.</p>
    </noscript>
    <script>
      // If the app bundle fails to load (e.g. a cached page referencing files from an older deploy),
      // reload once to fetch the current version; otherwise show a message instead of a blank page.
      (function () {
        function fallback() {
          var root = document.getElementById('root');
          if (root && !root.hasChildNodes()) {
            root.innerHTML =
              '<div style="font-family:Inter,sans-serif;color:#fff;text-align:center;padding:6rem 1.5rem">' +
              '<h1 style="font-weight:300;font-size:2rem">The explorer could not load</h1>' +
              '<p style="color:#94a3b8">Please reload the page. If it keeps happening, clear the cache for this site.</p>' +
              '<button onclick="location.reload()" style="margin-top:1.5rem;padding:.75rem 1.5rem;border-radius:999px;border:0;font-weight:600;cursor:pointer">Reload</button></div>';
          }
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            var done = false;
            try { done = sessionStorage.getItem('pb-reloaded') === '1'; sessionStorage.setItem('pb-reloaded', '1'); } catch (_) {}
            if (!done) location.reload(); else fallback();
          }
        }, true);
        window.addEventListener('load', function () { setTimeout(fallback, 4000); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
